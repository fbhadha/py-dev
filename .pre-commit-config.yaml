# Commit gate: checks on the files being committed, never the whole program.
# This repo has no package, so there is no import-linter layering check.
# CI runs the same file with `--from-ref origin/main --to-ref HEAD`, so the
# whole diff is checked and old files are left alone.
# Install once: uv run pre-commit install
minimum_pre_commit_version: "4.0.0"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=500"]
        exclude: ^uv\.lock$   # the lockfile is generated and large
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: no-commit-to-branch
        args: ["--branch", "main", "--branch", "master"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff-check
        args: ["--fix", "--exit-non-zero-on-fix"]
      - id: ruff-format

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]

  - repo: local
    hooks:
      - id: mypy
        name: mypy (strict, the staged src files; follow_imports=silent keeps it per file)
        entry: uv run mypy
        language: system
        types: [python]
        files: ^scripts/
      - id: module-length
        name: pylint too-many-lines (400 src, 150 tests)
        entry: uv run pylint --disable=all --enable=too-many-lines --max-module-lines=400
        language: system
        types: [python]
        files: ^scripts/
      - id: test-module-length
        name: pylint too-many-lines (tests)
        entry: uv run pylint --disable=all --enable=too-many-lines --max-module-lines=150
        language: system
        types: [python]
        files: ^tests/
