name: Validate plugin

on:
  pull_request:
  push:
    branches: [main]

jobs:
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml pytest hypothesis ruff mypy
      - name: Skills, agents and manifests are well-formed
        run: python scripts/check_plugin.py
      - name: Every hook decision, against a scratch git repo
        run: python scripts/test_hooks.py
      - name: The data-engineering pack's example is green under the baseline's checks
        run: python scripts/check_pack_examples.py
      - name: Every baseline script template passes the baseline's own ruff
        run: python scripts/check_template_scripts.py
      - uses: astral-sh/setup-uv@v6
      - name: The baseline's dev dependency group resolves with Repowise
        run: python scripts/check_template_deps.py

  upstream-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Every upstream skill we call by name exists at its pinned commit with the expected invocation
        run: python scripts/check_upstream_skills.py
      - name: Report drift on the upstream default branches (advisory)
        run: python scripts/check_upstream_skills.py --latest
