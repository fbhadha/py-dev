name: Validate plugin

on:
  pull_request:
  push:
    branches: [main]

jobs:
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Skills, agents and manifests are well-formed
        run: python scripts/check_plugin.py

  upstream-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Every upstream skill we call by name exists at its pinned commit with the expected invocation
        run: python scripts/check_upstream_skills.py
      - name: Report drift on the upstream default branches (advisory)
        run: python scripts/check_upstream_skills.py --latest
