name: Validate plugin

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validator deps
        run: pip install pyyaml jsonschema
      - name: Validate SKILL.md frontmatter
        run: python scripts/validate_skills.py
      - name: Invocation switches agree across harnesses
        run: python scripts/check_invocation_sync.py
      - name: Manifests are well-formed JSON
        run: for f in .claude-plugin/plugin.json .claude-plugin/marketplace.json hooks/hooks.json upstream.json; do python -c "import json,sys; json.load(open(sys.argv[1])); print(sys.argv[1], 'OK')" "$f"; done

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Flag risky patterns in bundled scripts
        run: |
          echo "Scanning skills/ and scripts/ for high-risk shell patterns (advisory)."
          # Advisory grep: surfaces patterns reviewers must eyeball. Non-blocking by design.
          ! grep -rIEn \
            -e 'curl[^|]*\|[[:space:]]*(sh|bash)' \
            -e 'wget[^|]*\|[[:space:]]*(sh|bash)' \
            -e 'rm[[:space:]]+-rf[[:space:]]+/' \
            -e 'eval[[:space:]]+.*\$\(' \
            skills/ scripts/ || (echo "::warning::Risky pattern found above — require manual security review." && true)

  upstream-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Every upstream skill we call by name exists at its pinned commit with the expected invocation
        run: python scripts/check_upstream_skills.py
      - name: Report drift on the upstream default branches (advisory)
        run: python scripts/check_upstream_skills.py --latest
