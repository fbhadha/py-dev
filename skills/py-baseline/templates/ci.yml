# GitHub Actions. The GitLab equivalent is gitlab-ci.yml beside this file.
# Four jobs: the commit gate on the diff (pre-commit, tests not weakened), the test suite
# with coverage on the changed lines, the README commands, the Repowise change gate.
# Branch protection on main requires the first three; intake offers to set it.
name: checks

on:
  pull_request:
  push:
    branches: [main]

env:
  DO_NOT_TRACK: "1"
  REPOWISE_SKIP_EDITOR_SETUP: "1"
  UV_FROZEN: "1"

jobs:
  gate:
    name: commit gate on the diff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: pre-commit on the changed files
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          uv run pre-commit run --show-diff-on-failure --from-ref "$BASE" --to-ref HEAD
      - name: layering (import-linter, whole program; red on brownfield until the layering ticket lands)
        run: uv run lint-imports
      - name: tests not weakened (deleted test, added skip, fewer assertions)
        if: github.event_name == 'pull_request'
        run: uv run python scripts/check_test_diff.py "origin/${{ github.base_ref }}...HEAD"
      - name: no literal typed from memory (a path that names nothing, a key not in .env.example)
        if: github.event_name == 'pull_request'
        run: uv run python scripts/check_literals.py "origin/${{ github.base_ref }}...HEAD"

  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest -m "not eval" --cov --cov-report=lcov:coverage.lcov --cov-report=xml:coverage.xml
      - name: the lines this change added are tested (90%)
        if: github.event_name == 'pull_request'
        run: uv run diff-cover coverage.xml --compare-branch="origin/${{ github.base_ref }}" --fail-under=90
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.lcov

  readme-commands:
    name: README commands still run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - name: execute every ```bash ci``` block in README.md
        run: uv run python scripts/run_readme_blocks.py README.md

  change-gate:
    name: Repowise change gate
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - name: index (no model, nothing written outside .repowise/)
        run: uv run repowise init --no-prose --no-editor-setup --no-save-key -y
      - name: bind accepted ADRs to the paths they govern
        run: uv run python scripts/adr_sync.py --no-index
      - name: no touched file got worse
        run: uv run python scripts/repowise_gate.py "origin/${{ github.base_ref }}..HEAD"
